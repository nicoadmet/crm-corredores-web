name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout web
        uses: actions/checkout@v4
        with:
          path: crm-corredores-web

      - name: Checkout api (repo hermano, para el chequeo de tipos cruzado)
        uses: actions/checkout@v4
        with:
          repository: nicoadmet/crm-corredores-api
          token: ${{ secrets.API_REPO_TOKEN }}
          path: crm-corredores-api

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias del backend
        working-directory: crm-corredores-api
        run: npm ci
        env:
          DATABASE_URL: "postgresql://user:pass@localhost:5432/db"

      - name: Instalar dependencias del frontend
        working-directory: crm-corredores-web
        run: npm ci

      - name: Lint
        working-directory: crm-corredores-web
        run: npm run lint

      - name: Build
        working-directory: crm-corredores-web
        run: npm run build

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build para producción
        run: npx vite build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
      - name: Deploy a Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}